[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "study-tk"
version = "3.7.1"
description = "Study Toolkit - OCR, split PDFs, and process markdown files"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "PyMuPDF>=1.23.0",
    "pymupdf4llm>=0.0.17",
    "mistralai>=0.1.0",
    "zai-sdk>=0.2.2",
    "rich>=13.0.0",
    "questionary>=2.0.0",
    "tqdm>=4.66.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = ["python-dotenv"]

[project.scripts]
study-tk = "study_tk.cli:main"

[tool.uv]
python-version = "3.13"
